# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
        env:
          # react-scripts promotes lint warnings to errors when CI=true, which
          # GitHub Actions sets by default. The repo has pre-existing warnings;
          # they still print, but must not fail the deploy.
          CI: false
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANGELNIVAR_PORTFOLIO }}
          channelId: live
          projectId: angelnivar-portfolio
